# @package _global_

defaults:
  - override /hydra/sweeper: optuna

optimized_metric: "val/I2T_R1"

hydra:
  mode: "MULTIRUN"

  job:
    env_set:
      WANDB_RUN_GROUP: "${oc.select:hydra.sweeper.study_name, 'mamba_retrieval_default'}"

  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
#    storage: "sqlite:///hpo.db" # Fixed the missing quote here
    storage: sqlite:///mamba_sweep_bigger.db
    study_name: mamba_retrieval_sweep_bigger
    n_jobs: 1
    direction: maximize
    n_trials: 45

    # The Pruner MUST be defined inside the sampler block for Hydra
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 10

    # MOVED: This is now at the correct level (under sweeper, not inside it)
    # Actually, standard Hydra-Optuna plugin syntax usually expects it here:
    # but some versions require it specifically formatted:
    search_space: null

#    params:
#      model.optimizer.lr: tag(log, interval(1e-5, 1e-3))
#      model.optimizer.weight_decay: interval(0.01, 0.1)
#      model.text_net.d_state: choice(32, 64, 128)
#      model.text_net.expand: choice(2, 4)
#      data.crop_scale: choice([0.3, 1.0], [0.5, 1.0], [0.8, 1.0])
#      data.color_jitter: interval(0.1, 0.5)
#      data.erasing_prob: interval(0.0, 0.4)
#      data.max_length: choice(32, 64, 77, 128)

    params:
      # 1. Broaden LR search but keep it central
      model.optimizer.lr: tag(log, interval(1.2e-4, 2.5e-4))

      # 2. Lock the Mamba "Expand" - 2 is usually plenty for base models
      # model.text_net.expand: 2

      # 3. Give Mamba more room to breathe with d_state
      model.text_net.d_state: choice(32, 64)

      # 4. Critical for Retrieval: The "Context Window"
      data.max_length: choice(128, 256)

      # model.logit_scale_init: interval(0.01, 0.15)

      # model.optimizer.weight_decay: tag(log, interval(1e-4, 1e-1))

      model.text_net.dropout: interval(0.15, 0.3)

      trainer.accumulate_grad_batches: choice(2, 4, 8)

#      # 5. Pick one representative "Hard" augmentation setting
      # model.crop_scale: choice([0.5, 1.0], [0.8, 1.0])