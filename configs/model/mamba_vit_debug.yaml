_target_: src.models.mamba2_module.Mamba2LitModule

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.001  # Higher learning rate for debugging
  weight_decay: 0.01

scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  _partial_: true
  step_size: 10
  gamma: 0.5

# Simplified Mamba + ViT for debugging
image_net:
  _target_: src.models.components.pretrained_vision.Mamba2WithPretrainedVision
  vision_encoder:
    _target_: src.models.components.pretrained_vision.PretrainedVisionEncoder
    backbone: vit_b16
    pretrained: true
    feature_dim: 768
    d_model: 64  # Much smaller for debugging
    freeze_backbone: true  # Keep frozen for stability
  mamba2_model:
    _target_: src.models.components.mamba_ssm_local.modules.mamba2.Mamba2
    d_model: 64
    d_state: 8  # Minimal complexity
    d_conv: 4
    expand: 2
    headdim: 8
  d_model: 64

# Common parameters
d_model: 64  # Text model d_model
image_d_model: 64  # Image model d_model

# Mamba for text only
text_net:
  _target_: src.models.components.mamba_ssm_local.modules.mamba2.Mamba2
  d_model: 64
  d_state: 8  # Match image model
  d_conv: 4
  expand: 2
  headdim: 8

compile: false
