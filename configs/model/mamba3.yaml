_target_: src.models.mamba3_module.Mamba3LitModule

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.000001              # 0.0001 # was 10x smaller
  weight_decay: 0.05

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: max  # Since we want to maximize recall metrics
  factor: 0.1
  patience: 10
