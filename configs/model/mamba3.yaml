# Latest edit: d_model -> 768, n_layers -> 6
# Added multi-layer Mamba3
# Added actual dropout

text_net:
  _target_: src.models.components.mamba_ssm_local.modules.mamba3.Mamba3
  d_model: 768
  d_state: 256
  d_conv: 4
  expand: 2
  headdim: 16
  n_layers: 1
  dropout: 0.2

# compile model for faster training with pytorch 2.0
compile: false

logit_scale_init: 0.07  # Tune this between 0.01 and 0.2
