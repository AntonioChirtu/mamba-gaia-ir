_target_: src.models.mamba2_module.Mamba2LitModule

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.001
  weight_decay: 0.0

# TODO: replace with Cosine Decay with Warmup
scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.1
  patience: 10

# Option 1: Use pretrained vision backbone (ResNet/ViT)
image_net_pretrained_vision:
  _target_: src.models.components.pretrained_vision.Mamba2WithPretrainedVision
  vision_encoder:
    _target_: src.models.components.pretrained_vision.PretrainedVisionEncoder
    backbone: resnet50  # Options: resnet50, resnet101, vit_b16
    pretrained: true
    feature_dim: 2048
    d_model: 128
    freeze_backbone: false
  mamba2_model:
    _target_: src.models.components.mamba_ssm_local.modules.mamba2.Mamba2
    d_model: 128
    d_state: 32
    d_conv: 4
    expand: 2
    headdim: 8
  d_model: 128

# Option 2: Use pretrained Mamba weights (if available)
image_net_pretrained_mamba:
  _target_: src.models.components.mamba_pretrained.create_vision_pretrained_mamba
  d_model: 128
  d_state: 32
  d_conv: 4
  expand: 2
  headdim: 8
  checkpoint_path: null  # Set path to pretrained vision Mamba checkpoint

# Option 3: Original approach with patch embedding
image_net_original:
  _target_: src.models.components.mamba_ssm_local.modules.mamba2.Mamba2
  d_model: 128
  d_state: 32
  d_conv: 4
  expand: 2
  headdim: 8

text_net:
  _target_: src.models.components.mamba_ssm_local.modules.mamba2.Mamba2
  d_model: 128
  d_state: 32
  d_conv: 4
  expand: 2
  headdim: 8

# compile model for faster training with pytorch 2.0
compile: false
