_target_: src.models.vit_mamba_multimodal.VitMambaMultimodalLitModule

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001  # Lower learning rate for multimodal stability
  weight_decay: 0.1  # Strong regularization for multimodal

# Use cosine decay with warmup for better convergence
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
  _partial_: true
  T_0: 10
  T_mult: 2
  eta_min: 1e-6

# Vision Transformer backbone for images
vision_encoder:
  _target_: src.models.components.vit.VisionTransformer
  img_size: 224
  patch_size: 16
  in_channels: 3
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  dropout: 0.1
  attention_dropout: 0.1

# Mamba encoder for text
text_encoder:
  _target_: src.models.components.mamba_ssm_local.modules.mamba2.Mamba2
  d_model: 768  # Match ViT embedding dimension
  d_state: 16
  d_conv: 4
  expand: 2
  headdim: 64
  dropout: 0.1

# Fusion layer for multimodal integration
fusion:
  _target_: src.models.components.fusion.MultimodalFusion
  vision_dim: 768
  text_dim: 768
  fusion_dim: 512
  dropout: 0.2

# Projection heads for contrastive learning
projections:
  vision_proj:
    _target_: src.models.components.projection.ProjectionHead
    input_dim: 768
    hidden_dim: 512
    output_dim: 256
    dropout: 0.1
  text_proj:
    _target_: src.models.components.projection.ProjectionHead
    input_dim: 768
    hidden_dim: 512
    output_dim: 256
    dropout: 0.1

# Contrastive loss parameters
contrastive:
  temperature: 0.07  # Optimal temperature for contrastive learning
  loss_type: "InfoNCE"

# compile model for faster training with pytorch 2.0
compile: false
