image_net:
  _target_: src.models.components.vit_optimized.ViTOnlySimpleOptimized
  backbone: vit_b16
  pretrained: true
  d_model: 128
  freeze_backbone: false  # Fine-tune for faster adaptation
  use_layer_norm: true
  dropout: 0.1

