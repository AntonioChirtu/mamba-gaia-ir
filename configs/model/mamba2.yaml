_target_: src.models.mamba2_module.Mamba2LitModule

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001 # was 10x smaller
  weight_decay: 0.0

# TODO: replace with Cosine Decay with Warmup
scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: max  # Since we want to maximize recall metrics
  factor: 0.1
  patience: 10

