# @package _global_

# to execute this experiment run:
# python train.py experiment=vit_mamba_multimodal

defaults:
  - override /data: multimodal  # Assuming you'll create this data config
  - override /model: vit_mamba_multimodal
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["multimodal", "vit", "mamba", "contrastive"]

seed: 42

trainer:
  min_epochs: 20
  max_epochs: 100
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 2  # Effective batch size doubling
  precision: "16-mixed"  # Mixed precision training

model:
  optimizer:
    lr: 0.0001
    weight_decay: 0.1
  contrastive:
    temperature: 0.07  # Proper temperature for contrastive learning
  compile: false

data:
  batch_size: 64  # Smaller batch for multimodal
  num_workers: 4

logger:
  csv:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir: ${paths.output_dir}
    name: "multimodal_logs"
  wandb:
    tags: ${tags}
    group: "multimodal"
    project: "vit-mamba-multimodal"

callbacks:
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: "val_loss"
    patience: 15
    mode: "min"
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: "val_loss"
    mode: "min"
    save_top_k: 3
    filename: "multimodal-{epoch:02d}-{val_loss:.2f}"
