# @package _global_

# Quick test experiment - runs in under a minute

defaults:
  - override /data: gaia
  - override /model: mamba2
  - override /callbacks: default
  - override /trainer: default

tags: ["GAIA", "mamba2", "quick_test"]

seed: 42

trainer:
  min_epochs: 1
  max_epochs: 1
  overfit_batches: 5  # Use overfit_batches instead of limit_train_batches
  log_every_n_steps: 1
  check_val_every_n_epoch: 1
  precision: 16-mixed
  accumulate_grad_batches: 1

model:
  optimizer:
    lr: 0.001

data:
  batch_size: 4  # Small batch size
  num_workers: 2

logger:
  csv:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir: ${paths.output_dir}
    name: "quick_test_logs"
  wandb:
    tags: ${tags}
    project: "lightning-hydra-template"
    group: "quick_test"

callbacks:
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: "val/I2T_R1"
    patience: 3
    mode: "max"
    min_delta: 0.001
