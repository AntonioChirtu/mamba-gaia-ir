# @package _global_

# Mamba + ViT pretrained backbone experiment
# to execute this experiment run:
# python train.py experiment=mamba_vit_pretrained_exp

defaults:
  - override /data: gaia
  - override /model: mamba_vit_pretrained
  - override /callbacks: default
  - override /trainer: default

tags: ["GAIA", "mamba_vit_pretrained", "hybrid"]

seed: 12345

trainer:
  min_epochs: 1
  max_epochs: 50
  gradient_clip_val: 1.0
  log_every_n_steps: 5
  check_val_every_n_epoch: 1
  limit_test_batches: 1.0  # Run full test set
  test_epoch_interval: 10  # Run test every 10 training epochs
  precision: 16-mixed  # Mixed precision for memory efficiency
  accumulate_grad_batches: 1

model:
  optimizer:
    lr: 0.0001  # Lower learning rate for stability
    weight_decay: 0.01

data:
  batch_size: 16  # Smaller batch due to hybrid model complexity
  num_workers: 4

logger:
  csv:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir: ${paths.output_dir}
    name: "mamba_vit_pretrained_logs"
  wandb:
    tags: ${tags}
    group: "mamba_vit_pretrained"
    project: "lightning-hydra-template"
    entity: "mihail-chirtu-polytechnica-university-of-bucharest"

callbacks:
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: "val/I2T_R1"
    patience: 15
    mode: "max"
    min_delta: 0.001
