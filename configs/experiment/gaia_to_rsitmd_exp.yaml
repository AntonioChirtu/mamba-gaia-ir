# @package _global_

# Multi-positive loss comparison against:
# jumping-tree-658 / 7e0ysuag
# Previous best val/mean_R1_best: 0.13230088

defaults:
  - override /data: rsitmd
  - override /model: mamba3
  - override /callbacks: default
  - override /trainer: default

tags:
  - rsitmd
  - mamba3
  - multi-positive

seed: 12345

data:
  batch_size: 256
  max_length: 77
  max_captions: 5

trainer:
  min_epochs: 10
  max_epochs: 100
  gradient_clip_val: 0.5
  gradient_clip_algorithm: norm
  accumulate_grad_batches: 1
  precision: bf16-mixed

model:
  image_net:
    d_model: 512
    dropout: 0.2

  text_net:
    d_model: 768
    d_state: 64
    n_layers: 1
    dropout: 0.2

  optimizer:
    lr: 1.5e-4
    weight_decay: 0.05

  scheduler:
    mode: max
    factor: 0.1
    patience: 5

callbacks:
  early_stopping:
    monitor: val/mean_R1
    mode: max
    patience: 100