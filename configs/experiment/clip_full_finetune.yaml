# @package _global_
# Run: python src/train.py experiment=clip_full_finetune

defaults:
  - override /data: gaia
  - override /model: mamba3
  - override /callbacks: default
  - override /trainer: default

tags: ["gaia", "clip_full_finetune"]

seed: 12345

model:
  image_net: null
  text_net: null

  dual_encoder:
    _target_: src.models.components.full_clip.CLIPPretrainedDualEncoder
    model_name: ViT-B-32
    pretrained: openai

    unfreeze_last_n_visual_blocks: 0
    unfreeze_last_n_text_blocks: 0
    fully_unfreeze_visual: true
    fully_unfreeze_text: true
    train_projection_heads: true
    train_logit_scale: true

trainer:
  min_epochs: 10
  max_epochs: 100
  gradient_clip_val: 0.5
  gradient_clip_algorithm: norm
  precision: bf16-mixed
  accumulate_grad_batches: 4