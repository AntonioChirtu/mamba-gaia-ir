defaults:
  - model_checkpoint
  - early_stopping
  - model_summary
  - rich_progress_bar
  - optuna_pruning
  - _self_

optimized_metric: "val/mean_R1"

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: "val/mean_R1"
  mode: "max"
  save_last: true
  auto_insert_metric_name: false

early_stopping:
  monitor: "val/mean_R1"
  patience: 100
  mode: "max"
  check_on_train_epoch_end: false

model_summary:
  max_depth: -1