_target_: src.data.gaia_datamodule.GAIADataModule
data_dir: ${paths.data_dir}
# Expects data_dir/{train,val/test}/<shared>/<sample>.{png,json,txt}
# Set to a list (e.g., [Bioshphere, Hydrosphere, Atmosphere]) to restrict training to a
# sphere subset, based on `tag`; null trains on all of GAIA
spheres: null  
batch_size: 128 # Needs to be divisible by the number of devices (e.g., if in a distributed setup)
num_workers: 4
pin_memory: True
max_length: 128
#tokenizer:
#  path: "eleutherai/gpt-neox-20b"
#  padding_side: "left"
#  max_length: 2048
#  truncation: true

tokenizer:
  _target_: transformers.AutoTokenizer.from_pretrained
  pretrained_model_name_or_path: eleutherai/gpt-neox-20b
