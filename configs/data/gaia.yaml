_target_: src.data.gaia_datamodule.GAIADataModule
data_dir: ${paths.data_dir}
# Directory holding the official {train, val, test}_data.json split files.
splits_dir: ${paths.root_dir}/data/GAIA
# only used as fallback when official split files are not found
train_val_test_split: [0.8, 0.2, 0]
batch_size: 128 # Needs to be divisible by the number of devices (e.g., if in a distributed setup)
num_workers: 4
pin_memory: True
max_length: 128
#tokenizer:
#  path: "eleutherai/gpt-neox-20b"
#  padding_side: "left"
#  max_length: 2048
#  truncation: true

tokenizer:
  _target_: transformers.AutoTokenizer.from_pretrained
  pretrained_model_name_or_path: eleutherai/gpt-neox-20b
